<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game JS Builder</title>

    <link rel="stylesheet" href="game-build.css">
</head>

<body>

<div class="container">

    <h1>🎮 Game JS Builder</h1>

    <p class="subtitle">
        Isi informasi game lalu generate file game.js
    </p>


    <!-- =========================
         INFORMASI GAME
    ========================== -->

    <div class="form-group">
        <label>Judul Game</label>
        <input type="text" id="title" placeholder="Contoh: From The Sin">
    </div>


    <div class="form-group">
        <label>Developer</label>
        <input type="text" id="developer" placeholder="Contoh: Vorpalic">
    </div>


    <div class="form-group">
        <label>Version</label>
        <input type="text" id="version" placeholder="Contoh: 0.11b">
    </div>
    
    <div class="form-group">
    <label>Engine</label>
    <input
        type="text"
        id="engine"
        placeholder="Contoh: Ren'Py / RPG Maker / Unity"
    >
</div>


<div class="form-group">
    <label>Status</label>
    <input
        type="text"
        id="status"
        placeholder="Contoh: Ongoing / Complete"
    >
</div>


<div class="form-group">
    <label>Badge</label>
    <input
        type="text"
        id="badge"
        placeholder="New / UPDT / kosong"
    >
</div>


<div class="form-group">
    <label>Content Rating</label>
    <input
        type="text"
        id="contentRating"
        placeholder="Contoh: Uncensored / Cencored"
    >
</div>
    
    <div class="form-group">
    <label>Tanggal Rilis</label>
    <input type="text" id="released" placeholder="Contoh: 30-08-2026">
</div>

<div class="form-group">
    <label>Tanggal Update</label>
    <input type="text" id="updated" placeholder="Contoh: 20-08-2026">
</div>

<div class="form-group">
    <label>Size</label>
    <input
        type="text"
        id="size"
        placeholder="Contoh: 2 GB / 3 GB"
    >
</div>

<div class="form-group">
    <label>Language</label>
    <input type="text" id="languages" placeholder="Contoh: English, Indonesia">
</div>

<div class="form-group">
    <label>Nama Folder</label>
    <input type="text" id="folder" placeholder="Contoh: renpy/echoes">
</div>


    <div class="form-group">
        <label>Genre</label>
        <textarea id="genres" placeholder="Contoh: Harem, Fantasy, Adventure"></textarea>
    </div>


    <div class="form-group">
        <label>Sinopsis</label>
        <textarea id="synopsis" class="big-text" placeholder="Masukkan sinopsis game..."></textarea>
    </div>


    <!-- =========================
         LINK DOWNLOAD
    ========================== -->

    <div class="form-group">
        <label>Link VIP / Berbayar</label>
        <input type="url" id="paidLink" placeholder="https://...">
    </div>


    <div class="form-group">
        <label>Link Free / Gratis</label>
        <input type="url" id="freeLink" placeholder="https://...">
    </div>


    <!-- =========================
         FITUR YES / NO
    ========================== -->

    <h2>⚙️ Fitur Game</h2>


    <div class="option">
        <span>VIP / Berbayar</span>

        <div class="switch">
            <button type="button"
                    class="yes active"
                    data-target="paid"
                    onclick="setOption('paid', true, this)">
                YES
            </button>

            <button type="button"
                    class="no"
                    data-target="paid"
                    onclick="setOption('paid', false, this)">
                NO
            </button>
        </div>
    </div>


    <div class="option">
        <span>Free / Gratis</span>

        <div class="switch">
            <button type="button"
                    class="yes active"
                    data-target="free"
                    onclick="setOption('free', true, this)">
                YES
            </button>

            <button type="button"
                    class="no"
                    data-target="free"
                    onclick="setOption('free', false, this)">
                NO
            </button>
        </div>
    </div>


    <div class="option">
        <span>Android</span>

        <div class="switch">
            <button type="button"
                    class="yes active"
                    data-target="android"
                    onclick="setOption('android', true, this)">
                YES
            </button>

            <button type="button"
                    class="no"
                    data-target="android"
                    onclick="setOption('android', false, this)">
                NO
            </button>
        </div>
    </div>


    <div class="option">
        <span>Windows / PC</span>

        <div class="switch">
            <button type="button"
                    class="yes active"
                    data-target="windows"
                    onclick="setOption('windows', true, this)">
                YES
            </button>

            <button type="button"
                    class="no"
                    data-target="windows"
                    onclick="setOption('windows', false, this)">
                NO
            </button>
        </div>
    </div>
    
        <div class="option">
        <span>Tampilkan Credit TL</span>

        <div class="switch">
            <button type="button"
                    class="yes active"
                    data-target="showCredit"
                    onclick="setOption('showCredit', true, this)">
                YES
            </button>

            <button type="button"
                    class="no"
                    data-target="showCredit"
                    onclick="setOption('showCredit', false, this)">
                NO
            </button>
        </div>
    </div>


    <div class="option">
        <span>Tampilkan di Banner</span>

        <div class="switch">
            <button type="button"
                    class="yes active"
                    data-target="featured"
                    onclick="setOption('featured', true, this)">
                YES
            </button>

            <button type="button"
                    class="no"
                    data-target="featured"
                    onclick="setOption('featured', false, this)">
                NO
            </button>
        </div>
    </div>
    
    <div class="option">
    <span>Tampilkan Screenshot</span>

    <div class="switch">
        <button type="button"
                class="yes active"
                data-target="screenshots"
                onclick="setOption('screenshots', true, this)">
            YES
        </button>

        <button type="button"
                class="no"
                data-target="screenshots"
                onclick="setOption('screenshots', false, this)">
            NO
        </button>
    </div>
</div>


    <!-- =========================
         TOMBOL GENERATE
    ========================== -->

    <button class="generate" onclick="generateGameJS()">
        🚀 BUAT game.js
    </button>


    <div id="status"></div>

</div>


<script src="game-build.js"></script>

</body>
</html>
